openapi: 3.0.4
info:
  title: Hashtag Generator
  description: >-
    Hashtag Generator creates relevant hashtags from any plain text or post
    caption. Pass in a text snippet to receive an array of suggested social
    tags, with paid plans able to customize the tag count.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  version: 1.0.0
externalDocs:
  description: Learn more about APIVerve
  url: https://docs.apiverve.com?utm_source=openapi
servers:
  - url: https://api.apiverve.com/
paths:
  /v1/hashtaggenerator:
    post:
      summary: Hashtag Generator
      description: Generate hashtags from text
      operationId: hashtaggenerator
      parameters: []
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  count: 5
                  hashtags:
                    - '#adventure'
                    - '#awaits'
                    - '#ready'
                    - '#embark'
                    - '#journey'
                  topicHashtags:
                    - hashtag: '#Adventure'
                      phrase: adventure
                      relevance: 0.579
                    - hashtag: '#Travel'
                      phrase: travel
                      relevance: 0.567
                    - hashtag: '#Journey'
                      phrase: journey
                      relevance: 0.48
                    - hashtag: '#ExoticLandscapes'
                      phrase: exotic landscapes
                      relevance: 0.436
                    - hashtag: '#VibrantCultures'
                      phrase: vibrant cultures
                      relevance: 0.314
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
                  description: The text to generate hashtags from
                count:
                  type: number
                  description: Number of hashtags to generate. 1 to 10)
              required:
                - text
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: x-api-key
      in: header
security:
  - api_key: []
sampleRequest:
  text: >-
    Adventure awaits 🌍✈️ Who's ready to embark on a journey of a lifetime?
    Whether you're exploring exotic landscapes, immersing yourself in vibrant
    cultures, or simply indulging in delicious cuisines, there's something
    magical about travel that fills the soul with joy and wonder. Let's wander
    together and create unforgettable memories! 🌟
  count: 5
